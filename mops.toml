[package]
name = "ekvm"
version = "0.0.1"
description = "Elastic Key-Value Map: a sharded key-value database library for the Internet Computer"
repository = "https://github.com/BarFTW/Ekvm"
license = "Apache-2.0"
keywords = [ "database", "key-value", "sharding", "index" ]

[dependencies]
core = "2.6.2"
sha2 = "0.3.2"

[toolchain]
moc = "2.2.1"
pocket-ic = "16.1.0"
wasmtime = "50.0.1"

[dev-dependencies]
test = "2.1.2"
